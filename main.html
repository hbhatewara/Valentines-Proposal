<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>


  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>


  <style>
    :root {
      --bg1: #f7a4c6;
      --bg2: #faa2cb;
      --card: #ffffffcc;
      --yes: #bb24f1;
      --yesHover: #c525fa;
    }


    * { box-sizing: border-box; }


    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }


    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }


    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }


    /* CHANGED: art image styling (size, radius, etc.) */
    .art {
      width: min(200px, 60vw);
      height: auto;
      margin: 0 auto 16px;
      display: block;
      object-fit: cover;
      border-radius: 16px;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }


    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 16px 0 12px;
    }


    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }


    /* CHANGED: nicer button hover/active feel */
    button {
      position: absolute;
      top: 50%;
      padding: 16px 28px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }


    button:active {
      transform: translateY(-48%) scale(0.97);
      box-shadow: 0 6px 18px rgba(0,0,0,.22);
    }


    /* CHANGED: Yes button hover glow */
    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }
    
    #yesBtn:hover {
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 12px 30px rgba(187, 36, 241, .6);
      background: var(--yesHover);
    }


    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }


    .hint {
      margin-top: 14px;
      font-size: 13px;
      opacity: .8;
    }


    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }


    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }


.fireworks {
  width: min(240px, 65vw);   /* smaller max width for phones */
  max-height: 240px;         /* cap the height */
  margin: 0 auto;
  display: block;
  object-fit: contain;       /* keeps proportions perfect */
}


    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }


    /* NEW: No button shake animation */
    @keyframes shake {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      25% { transform: translateY(-50%) translateX(-3px); }
      75% { transform: translateY(-50%) translateX(3px); }
    }


    #noBtn.shake {
      animation: shake 0.25s;
    }


    /* Optional: small-screen tweak */
    @media (max-width: 480px) {
      .card {
        padding: 20px 16px;
      }


      h1 {
        font-size: clamp(22px, 5vw, 34px);
      }
    }
  </style>
</head>


<body>
  <canvas id="confettiCanvas"></canvas>


  <main class="card">
    <!-- OUR PICTURE (UNCHANGED STRUCTURE, uses .art styles) -->
    <img
      class="art"
      src="us.jpeg"
      alt="Cute proposal image"
    />


    <!-- CHANGED: we will update this text after Yes in JS -->
    <h1>Alexandra, will you be my valentine?</h1>


    <section class="button-zone" id="zone">
      <!-- CHANGED: aria-labels added -->
      <button id="yesBtn" aria-label="Yes, I will be your Valentine">Yes</button>
      <button id="noBtn" aria-label="No, I will not be your Valentine">No</button>
    </section>


    <!-- HINT (first message; will change in JS) -->
    <div class="hint" id="hint">Surely you can't say no...</div>


    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img
        class="fireworks"
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZDlzOGpuZmN1eHRxNG00cGd1OWFxanFkcDc2Nzhkb3A2NmswYmQzdiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/geslvCFM31sFW/giphy.gif"
        alt="Fireworks"
      />
    </section>
  </main>


<script>
  const zone = document.getElementById("zone");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const result = document.getElementById("result");
  const hint = document.getElementById("hint");
  const title = document.querySelector("h1");

  /* messages for the hint */
  const messages = [
    "Surely you can't say no...",
    "Think about it carefully 👀",
    "Are you suuure about that?",
    "Last chance to say yes! 💜"
  ];
  let msgIndex = 0;

  function updateHint() {
    msgIndex = (msgIndex + 1) % messages.length;
    hint.textContent = messages[msgIndex];
  }

  /* ---------- CONFETTI ---------- */
  const confettiCanvas = document.getElementById("confettiCanvas");

  function resizeConfettiCanvas() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    confettiCanvas.width = Math.floor(window.innerWidth * dpr);
    confettiCanvas.height = Math.floor(window.innerHeight * dpr);
    confettiCanvas.style.width = "100vw";
    confettiCanvas.style.height = "100vh";
  }

  resizeConfettiCanvas();
  window.addEventListener("resize", resizeConfettiCanvas);
  window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

  const confettiInstance = confetti.create(confettiCanvas, {
    resize: false,
    useWorker: true
  });

  function fullScreenConfetti() {
    const end = Date.now() + 1600;

    (function frame() {
      confettiInstance({
        particleCount: 12,
        spread: 90,
        startVelocity: 45,
        ticks: 180,
        origin: { x: Math.random(), y: Math.random() * 0.3 }
      });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();

    setTimeout(() => {
      confettiInstance({
        particleCount: 300,
        spread: 140,
        startVelocity: 60,
        ticks: 220,
        origin: { x: 0.5, y: 0.55 }
      });
    }, 300);
  }

  /* ---------- YES / NO SCALE ---------- */
  let yesScale = 1;
  let noScale = 1;

  function applyScales() {
    yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    noBtn.style.transform  = `translateY(-50%) scale(${noScale})`;
  }

  function growYes() {
    yesScale = Math.min(2.4, yesScale + 0.15);
    applyScales();
  }

  function shrinkNo() {
    noScale = Math.max(0.5, noScale - 0.1);
    applyScales();
  }

  /* ---------- NO CLICK: SHRINK NO, GROW YES, SHAKE ---------- */
  noBtn.addEventListener("click", e => {
    e.preventDefault();
    shrinkNo();
    growYes();
    updateHint();
    
    // Shake on click
    noBtn.classList.add("shake");
    setTimeout(() => noBtn.classList.remove("shake"), 250);
  });

  /* ---------- YES CLICK ---------- */
  yesBtn.addEventListener("click", () => {
    zone.style.display = "none";
    hint.style.display = "none";
    result.style.display = "block";
    title.textContent = "Best. Decision. Ever. 💜";
    resizeConfettiCanvas();
    fullScreenConfetti();
  });
</script>


</body>
</html>
